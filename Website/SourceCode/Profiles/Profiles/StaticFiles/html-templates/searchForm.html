<!DOCTYPE html>
<html lang="en-us">
<head>
    <!-- Required meta tags for bootstrap -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{metaDescription}">

    <meta http-equiv="Cache-control" content="No-Store">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">

    <link href="{profilesPath}/Branding/myBranding.css" rel="stylesheet" type="text/css">
    <link href="{profilesPath}/StaticFiles/css/common/bigAndSmall.css" rel="stylesheet" type="text/css">
    <link href="{profilesPath}/StaticFiles/css/common/common-top-nav.css" rel="stylesheet" type="text/css">
    <link href="{profilesPath}/StaticFiles/css/common/common-access.css" rel="stylesheet" type="text/css">
    <link href="{profilesPath}/StaticFiles/css/common/common.css" rel="stylesheet" type="text/css">

    <link href="{profilesPath}/StaticFiles/css/search/search.css" rel="stylesheet" type="text/css">

    <script src="https://code.jquery.com/jquery-4.1.0.min.js" integrity="sha384-UGSi5euAzE1p4sK41+yKs3vtdPcidmaW6fY2NUITZkjIPyMVUUYB/BV4A5Oa8uu2" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>

    <script src="https://www.gstatic.com/charts/loader.js"></script>

    {globalVariables}

    {SessionInfo}
    <script>
        g.pageContext = 'search-form';
    </script>
    <script src="{profilesPath}/StaticFiles/js/common/globals.js" type="text/javascript"></script>
    <script src="{profilesPath}/Branding/myBranding.js" type="text/javascript"></script>
    <script src="{profilesPath}/StaticFiles/js/common/brandingUtil.js" type="text/javascript"></script>

    <script src="{profilesPath}/StaticFiles/js/search/searchCommon.js" type="text/javascript"></script>
    <script src="{profilesPath}/StaticFiles/js/common/common.js" type="text/javascript"></script>

    <script src="{profilesPath}/StaticFiles/js/common/parsers/exploreParse.js" type="text/javascript"></script>
    <script src="{profilesPath}/StaticFiles/js/common/insertCommonContent.js" type="text/javascript"></script>
    <script src="{profilesPath}/StaticFiles/js/common/misc.js" type="text/javascript"></script>
    <script src="{profilesPath}/StaticFiles/js/common/sorting.js" type="text/javascript"></script>
    <script src="{profilesPath}/StaticFiles/js/common/topBar.js" type="text/javascript"></script>

    <script src="{profilesPath}/StaticFiles/js/search/searchCommon.js" type="text/javascript"></script>
    <script src="{profilesPath}/StaticFiles/js/search/searchDropdowns.js" type="text/javascript"></script>
    <script src="{profilesPath}/StaticFiles/js/search/recentUpdates.js" type="text/javascript"></script>
    <script src="{profilesPath}/StaticFiles/js/search/searchForm.js" type="text/javascript"></script>

    <script src="{profilesPath}/StaticFiles/js/paging/paging.js" type="text/javascript"></script>

    <script type="text/javascript">
        // g.dataURLs = '{dataURLs}';
        // g.profilesRootURL = '{profilesRootURL}';
        // g.apiBasePath = '{apiBasePath}';
        // g.tab = '{tab}';
        // console.log("Global values after DisplayRepository replace", g);

        $(document).ready(setupSearchForm);
    </script>
</head>
<body>
    <main>
        {TrackingCode}
        <!-- banner is inserted dynamically-->
        <!--maybe insert dynamically?-->
        <div id="searchPageMarkup" class="moveable d-none row mt-4 me-0 w-100" dest="mainDiv">
            <div id="lhsDiv"></div> <!-- lhsDiv -->
            <div id="midDiv" class="search-form">
                <ul class="nav nav-tabs tabChoices mb-2" id="myTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active tabTopHat" id="people-tab" data-bs-toggle="tab" data-bs-target="#people"
                                type="button"
                                role="tab"
                                aria-controls="people" aria-selected="false">
                            Find People
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link tabTopHat" id="all-tab" data-bs-toggle="tab" data-bs-target="#all"
                                type="button" role="tab" aria-controls="all" aria-selected="true">
                            Find Everything Else
                        </button>
                    </li>
                </ul>
                <div class="tab-content" id="myTabContent">
                    <div class="tab-pane fade show active mt-3" id="people" role="tabpanel" aria-labelledby="people-tab">
                        <div id="peopleBox" class="tab-pane-box mt-3 pt-3 pb-3">
                            <div id="dropdownsAndNames">
                                <!-- Search filters (a11y R1/R2): real form controls instead of <li> click-lists.
                                     Single choice (Institution, Department): a native <select> (no .gradient class:
                                     its background-image !important would hide form-select's arrow).
                                     Multiple choice (Faculty Type, Profile Contains, Other Options): a toggle button
                                     that shows/hides a <fieldset> of labelled checkboxes.
                                     searchDropdowns.js fills in the options; it still moves each ...UlDiv into its row.
                                     aria-label is used because the visible label text is written by the script into a
                                     separate column; once that becomes <label for="...">, the aria-label can go. -->

                                <!-- script adds: <option value="{index}">{InstitutionName}</option> -->
                                <div id="institutionsUlDiv" position="1" class="ulDiv w-100">
                                    <select id="institutionsSelect" class="form-select" aria-label="Institution">
                                        <option value="">None selected</option>
                                    </select>
                                </div>

                                <!-- script adds: <option value="{index}">{DepartmentName}</option> -->
                                <div id="departmentsUlDiv" position="2" class="ulDiv w-100">
                                    <select id="departmentsSelect" class="form-select" aria-label="Department">
                                        <option value="">None selected</option>
                                    </select>
                                </div>

                                <!-- script adds, inside the fieldset:
                                     <label class="d-block"><input type="checkbox" class="facultyTypes me-1" value="{index}"> {FacultyRank}</label> -->
                                <div id="facultyTypesUlDiv" position="3" class="ulDiv w-100">
                                    <button type="button" id="facultyTypesButton" class="filterToggle gradient w-100 text-start"
                                            aria-expanded="false" aria-controls="facultyTypesGroup">
                                        <span class="visually-hidden">Faculty Type: </span>
                                        <span class="theChosen">None selected</span>
                                        <span class="float-end" aria-hidden="true">&#x25BE;</span>
                                    </button>
                                    <fieldset id="facultyTypesGroup" class="filterGroup" hidden>
                                        <legend class="visually-hidden">Faculty Type</legend>
                                    </fieldset>
                                </div>

                                <!-- script adds, inside the fieldset, one group per category:
                                     <fieldset class="filterCategory"><legend>{PersonFilterCategory}</legend>
                                         <label class="d-block"><input type="checkbox" class="hasSections me-1" value="{index}"> {PersonFilter}</label> ...
                                     </fieldset> -->
                                <div id="hasSectionsUlDiv" position="4" class="ulDiv w-100">
                                    <button type="button" id="hasSectionsButton" class="filterToggle gradient w-100 text-start"
                                            aria-expanded="false" aria-controls="hasSectionsGroup">
                                        <span class="visually-hidden">Profile Contains: </span>
                                        <span class="theChosen">None selected</span>
                                        <span class="float-end" aria-hidden="true">&#x25BE;</span>
                                    </button>
                                    <fieldset id="hasSectionsGroup" class="filterGroup" hidden>
                                        <legend class="visually-hidden">Profile Contains</legend>
                                    </fieldset>
                                </div>

                                <!-- script adds, inside the fieldset, one group per category (same shape as Profile Contains) -->
                                <div id="otherOptionsUlDiv" position="5" class="ulDiv w-100">
                                    <button type="button" id="otherOptionsButton" class="filterToggle gradient w-100 text-start"
                                            aria-expanded="false" aria-controls="otherOptionsGroup">
                                        <span class="visually-hidden">Other Options: </span>
                                        <span class="theChosen">None selected</span>
                                        <span class="float-end" aria-hidden="true">&#x25BE;</span>
                                    </button>
                                    <fieldset id="otherOptionsGroup" class="filterGroup" hidden>
                                        <legend class="visually-hidden">Other Options</legend>
                                    </fieldset>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane fade mt-3" id="all" role="tabpanel" aria-labelledby="all-tab">
                        <div id="allBox" class="tab-pane-box mt-3 pt-3 pb-3">
                        </div>
                    </div>
                </div> <!-- myTabContent -->
            </div> <!-- midDiv -->
            <div id="rhsDiv" class="search-form-passive"></div>  <!-- rhsDiv -->

        </div> <!-- searchPageMarkup -->
        <!-- footer is inserted dynamically-->
    </main>
</body>
</html>
