<!DOCTYPE html>
<html lang="en-us">
<head>
    <!-- Required meta tags for bootstrap -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{metaDescription}">

    <meta http-equiv="Cache-control" content="No-Store">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">

    <link href="{profilesPath}/Branding/myBranding.css" rel="stylesheet" type="text/css">
    <link href="{profilesPath}/StaticFiles/css/common/bigAndSmall.css" rel="stylesheet" type="text/css">
    <link href="{profilesPath}/StaticFiles/css/common/common-top-nav.css" rel="stylesheet" type="text/css">
    <link href="{profilesPath}/StaticFiles/css/common/common-access.css" rel="stylesheet" type="text/css">
    <!-- common should come after common-access, since hoverDark comes later than link-ish, so its 'important' prevails -->
    <link href="{profilesPath}/StaticFiles/css/common/common.css" rel="stylesheet" type="text/css">

    <link href="{profilesPath}/StaticFiles/css/paging/paging.css" rel="stylesheet" type="text/css">
    <link href="{profilesPath}/StaticFiles/css/search/search.css" rel="stylesheet" type="text/css">

    <script src="https://code.jquery.com/jquery-4.1.0.min.js" integrity="sha384-UGSi5euAzE1p4sK41+yKs3vtdPcidmaW6fY2NUITZkjIPyMVUUYB/BV4A5Oa8uu2" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>

    {globalVariables}

    {SessionInfo}
    <script>
        g.pageContext = 'search-results';
    </script>
    <script src="{profilesPath}/StaticFiles/js/common/globals.js" type="text/javascript"></script>
    <script src="{profilesPath}/Branding/myBranding.js" type="text/javascript"></script>
    <script src="{profilesPath}/StaticFiles/js/common/brandingUtil.js" type="text/javascript"></script>

    <script src="{profilesPath}/StaticFiles/js/search/searchCommon.js" type="text/javascript"></script>
    <script src="{profilesPath}/StaticFiles/js/common/common.js" type="text/javascript"></script>
    <script src="{profilesPath}/StaticFiles/js/common/parsers/exploreParse.js" type="text/javascript"></script>
    <script src="{profilesPath}/StaticFiles/js/common/insertCommonContent.js" type="text/javascript"></script>
    <script src="{profilesPath}/StaticFiles/js/common/misc.js" type="text/javascript"></script>
    <script src="{profilesPath}/StaticFiles/js/common/sorting.js" type="text/javascript"></script>
    <script src="{profilesPath}/StaticFiles/js/common/topBar.js" type="text/javascript"></script>

    <script src="{profilesPath}/StaticFiles/js/paging/paging.js" type="text/javascript"></script>
    <script src="{profilesPath}/StaticFiles/js/search/searchCommon.js" type="text/javascript"></script>
    <script src="{profilesPath}/StaticFiles/js/search/searchPeopleResultsDropdowns.js" type="text/javascript"></script>
    <script src="{profilesPath}/StaticFiles/js/search/searchPeopleResults.js" type="text/javascript"></script>

    <script type="text/javascript">
        // g.dataURLs = '{dataURLs}';
        // g.profilesRootURL = '{profilesRootURL}';
        // g.apiBasePath = '{apiBasePath}';
        // g.tab = '{tab}';
        // console.log("Global values after DisplayRepository replace", g);

        $(document).ready(function() {
            setupSearchPeopleResults();
        });
    </script>
</head>
<body>

    {TrackingCode}

    <!-- banner is inserted dynamically-->
    <!--maybe insert dynamically?-->
    <div id="searchPageMarkup" class="moveable d-none row ms-0 mt-2 w-100" dest="mainDiv">
        <div id="midDiv" class="ps-0">
            <div id="midDivInner" class="row ms-1">
                <div id="dropdownsDiv" class="row w-100 mt-2">
                    <!-- Sort and Show (a11y): Sort is a native <select>; Show is a button that shows/hides
                         a group of labelled checkboxes. Neither acts on change: re-running the search is a
                         new page load, so both wait for the Apply Filters button (on Windows, arrow keys
                         on a closed <select> fire 'change' at every step).
                         searchPeopleResultsDropdowns.js sets the current choices. -->
                    <div class="search-results-sort ps-0 pe-0 col-12 col-sm-12 col-md-4 col-lg-4 col-xl-4 col-xxl-4">
                        <label for="sortSelect" id="searchSort" class="bold float-start pt-1">Sort&nbsp;&nbsp;</label>
                        <div class="ulDiv search-results-sort-button d-inline-block">
                            <span class="selectWrap">
                                <select id="sortSelect" class="form-select searchFilterSelect gradient">
                                    <option value="relevance">Query Relevance</option>
                                    <option value="name" data-name="DisplayName" data-dir="Asc">Name (A-Z)</option>
                                    <option value="nameza" data-name="DisplayName" data-dir="Desc">Name (Z-A)</option>
                                    <option class="optional" value="institution" data-name="InstitutionName" data-dir="Asc">Institution (A-Z)</option>
                                    <option class="optional" value="institutionza" data-name="InstitutionName" data-dir="Desc">Institution (Z-A)</option>
                                    <option class="optional" value="department" data-name="DepartmentName" data-dir="Asc">Department (A-Z)</option>
                                    <option class="optional" value="departmentza" data-name="DepartmentName" data-dir="Desc">Department (Z-A)</option>
                                    <option class="optional" value="facultyrank" data-name="FacultyRank" data-dir="Asc">Faculty Rank (low-high)</option>
                                    <option class="optional" value="facultyrankdesc" data-name="FacultyRank" data-dir="Desc">Faculty Rank (high-low)</option>
                                </select>
                                <span class="selectArrow" aria-hidden="true">&#x25BE;</span>
                            </span>
                        </div>
                    </div>
                    <div class="search-results-show ps-0 pe-0 col-12 col-sm-12 col-md-4 col-lg-4 col-xl-4 col-xxl-4">
                        <span class="bold float-start me-1 pt-1" aria-hidden="true">Show&nbsp;&nbsp;</span>
                        <div id="showUlDiv" class="ulDiv d-inline-block">
                            <button type="button" id="showButton" class="filterToggle gradient text-start"
                                    aria-expanded="false" aria-controls="showGroup">
                                <span class="visually-hidden">Show columns: </span>
                                <span class="theChosen">None selected</span>
                                <span class="float-end" aria-hidden="true">&#x25BE;</span>
                            </button>
                            <fieldset id="showGroup" class="filterGroup" hidden>
                                <legend class="visually-hidden">Columns to show</legend>
                                <label class="filterOption d-block"><input id="showInstitution" class="showCheck me-1" type="checkbox" value="InstitutionName">Institution</label>
                                <label class="filterOption d-block"><input id="showDepartment" class="showCheck me-1" type="checkbox" value="DepartmentName">Department</label>
                                <label class="filterOption d-block"><input id="showFacultyRank" class="showCheck me-1" type="checkbox" value="FacultyRank">Faculty Rank</label>
                            </fieldset>
                        </div>
                    </div>
                    <div class="search-results-apply ps-0 pe-0 col-12 col-sm-12 col-md-4 col-lg-4 col-xl-4 col-xxl-4">
                        <button type="button" id="applyFiltersButton" class="btn btn-secondary btn-sm">Apply Filters</button>
                    </div>
                </div>
                <div id="resultsDiv" class="ps-0"></div>
            </div> <!-- midDivInner -->
        </div> <!-- midDiv -->
        <div id="rhsDiv" class="mt-5"></div>  <!-- rhsDiv -->

    </div> <!-- searchPageMarkup -->
    <!-- footer is inserted dynamically-->
</body>
</html>
